spring.application.name=ServiceBookingPlatform

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_platform}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Admin access control (comma-separated emails)
app.admin.emails=jacobhaimoff@gmail.com

# Auth0 JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://YOUR_AUTH0_DOMAIN/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://YOUR_AUTH0_DOMAIN/.well-known/jwks.json

# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Notifications: set RESEND_API_KEY to email the shop owner about new bookings (log-only when empty)
app.notifications.resend-api-key=${RESEND_API_KEY:}
app.notifications.from=${NOTIFY_FROM:torni <onboarding@resend.dev>}
# Public frontend URL, used for links in emails
app.public-url=${PUBLIC_URL:http://localhost:5173}
