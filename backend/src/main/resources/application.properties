spring.application.name=ServiceBookingPlatform

# Local development: put your settings in backend/.env (not committed, see .env.example).
# DB_USER and DB_PASSWORD have no default on purpose: the app refuses to start without them.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_platform}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Admin access control (comma-separated emails, set ADMIN_EMAILS)
app.admin.emails=${ADMIN_EMAILS:}

# Authentication. mode=local: this backend signs and validates its own tokens (development and pilot testing).
# mode=auth0: tokens come from Auth0 and are validated against its issuer (the last roadmap step).
app.auth.mode=${AUTH_MODE:local}
# At least 32 characters. If empty, a random key is generated and logins end on every restart.
app.auth.local.secret=${AUTH_LOCAL_SECRET:}
app.auth.local.token-hours=${AUTH_TOKEN_HOURS:168}
app.auth.auth0.issuer-uri=${AUTH0_ISSUER_URI:}
app.auth.auth0.audience=${AUTH0_AUDIENCE:}

# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Notifications: set RESEND_API_KEY to email the shop owner about new bookings (log-only when empty)
app.notifications.resend-api-key=${RESEND_API_KEY:}
app.notifications.from=${NOTIFY_FROM:torni <onboarding@resend.dev>}
# Public frontend URL, used for links in emails
app.public-url=${PUBLIC_URL:http://localhost:5173}

# Image uploads to Cloudflare R2 (presigned PUT straight from the browser). All five must be set to enable them.
app.uploads.account-id=${R2_ACCOUNT_ID:}
app.uploads.access-key-id=${R2_ACCESS_KEY_ID:}
app.uploads.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.uploads.bucket=${R2_BUCKET:}
# Public address of the bucket (r2.dev URL or custom domain), no trailing slash
app.uploads.public-url=${R2_PUBLIC_URL:}
# Folder prefix inside the bucket (dev or prod) so environments sharing a bucket never mix tenant ids. Required to enable uploads.
app.uploads.environment=${R2_ENVIRONMENT:}
